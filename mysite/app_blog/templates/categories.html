{% extends 'base.html' %}

{% block content %}
<h1 class="text-center">Категорії</h1>
{% if categories %}
{% for item in categories %}
<div>
    <a href="{{ item.get_absolute_url }}" type="button" class="btn btn-secondary" id="knopkacat">
        <h4>{{ item.category|upper }}</h4>
    </a>
</div>
{% endfor %}
{% endif %}
{% endblock %}
