{% extends 'base.html' %}
{% load static %}
{% block content %}
<ol class="breadcrumb">
    <li><a href="{{ item.category.get_absolute_url }}">{{ item.category|upper }}</a></li>
</ol>
<div>
    <h3>
        {{ item.title }}
    </h3>
    <h5>
        {{ item.pub_date|date:"d E Y"|safe|linebreaks }}
    </h5>
</div>
<div>
    {{ item.description|escape|safe }}
    {% if item.images.all %}
    {% include 'fotorama.html' with images=images %}
    {% endif %}
</div>
<div class='clearfix'></div>
{% endblock %}
