<!DOCTYPE html>
<html lang="uk">
{% load static %}

<head>
    <title>Blog</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link type="text/css" href="{% static 'css/main.css' %}" rel="stylesheet">
</head>

<body>
    <header>
        <h1 class="text-center">Персональний блог</h1>
        <nav class="navbar navbar-expand-lg bg-body-tertiary" id="main-nav">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-center" id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                        <a class="nav-link active" aria-current="page" href="{% url 'home' %}">Головна</a>
                        <a class="nav-link" href="{% url 'categories-list' %}">Категорії</a>
                        <a class="nav-link" href="{% url 'articles-list' %}">Всі публікації</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <div class="container mt-4">
        {% block content %}

        {% endblock %}
    </div>
    <script src="{% static 'js/jquery.js' %}" crossorigin="anonymous"></script>
    <script src="{% static 'js/bootstrap.min.js' %}" crossorigin="anonymous"></script>
</body>

</html>
