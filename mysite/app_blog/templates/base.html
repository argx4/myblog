<!DOCTYPE html>
<html lang="uk">
{% load static %}

<head>
    <title>Blog</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link type="text/css" href="{% static 'css/main.css' %}" rel="stylesheet">
    <link type="text/css" href="{% static 'css/nav.css' %}" rel="stylesheet">
    <link type="text/css" href="{% static 'css/backgroundstyle.css' %}" rel="stylesheet">
    <link type="text/css" href="{% static 'css/mobile.css' %}" rel="stylesheet">
</head>

<body>
    <header>
        <h1 class="text-center">Персональний блог</h1>
        <nav class="navbar navbar-expand-lg" id="main-nav">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-center" id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                        <a class="nav-link active" aria-current="page" href="{% url 'home' %}" id="home">Головна</a>
                        <a class="nav-link" href="{% url 'categories-list' %}" id="categories">Категорії</a>
                        <a class="nav-link" href="{% url 'articles-list' %}" id="articles">Всі публікації</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <div class="container mt-4">
        {% block content %}

        {% endblock %}
    </div>
    <footer id="footerbase">
        <div class="container mt-4">
            <div class="row">
                <div class="col-12">
                    <p class="text-center">© 2026 Персональний блог. Всі права захищені.</p>
                </div>
            </div>
        </div>
    </footer>
    <script src="{% static 'js/jquery.js' %}" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>

</html>
